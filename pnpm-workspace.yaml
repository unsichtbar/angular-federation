packages:
  - apps/*
  - tools/*
  - libs/*

# Single source of truth for dependency versions (like Maven's
# <dependencyManagement>). Packages reference these as "catalog:".
# Angular, RxJS and the SDK are federation singletons with strictVersion,
# so every app and tool must stay on the same versions.
catalog:
  '@angular-architects/native-federation': ~22.2.4
  '@angular/build': ^22.2.6
  '@angular/cli': ^22.2.6
  '@angular/common': ^22.2.0
  '@angular/compiler': ^22.2.0
  '@angular/compiler-cli': ^22.2.0
  '@angular/core': ^22.2.0
  '@angular/forms': ^22.2.0
  '@angular/platform-browser': ^22.2.0
  '@angular/router': ^22.2.0
  '@softarc/native-federation-orchestrator': ^4.8.0
  es-module-shims: ^2.8.0
  prettier: ^3.8.1
  rxjs: ~7.8.0
  tslib: ^2.3.0
  typescript: ~6.0.2
  yaml: ^2.9.1

# Reject `pnpm add` versions that aren't in the catalog.
catalogMode: strict

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
